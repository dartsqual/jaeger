# HotROD (jaegertracing/jaeger/examples/hotrod) instrumentado com Datadog dd-trace-go.
# Imagem hotrod-dd (ver ../README.md), build com o TracerProvider do dd-trace-go (flag -x datadog).
# Um Deployment por microsserviço: no dd-trace, 1 processo = 1 serviço.
# O Datadog Admission Controller injeta a conexão com o Agent (socket APM) e
# DD_ENV/DD_SERVICE/DD_VERSION a partir dos labels tags.datadoghq.com/*.
apiVersion: v1
kind: Namespace
metadata:
  name: hotrod
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: hotrod
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: hotrod
    tags.datadoghq.com/env: hotrod
    tags.datadoghq.com/service: hotrod-frontend
    tags.datadoghq.com/version: "1.0.2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: hotrod
        tags.datadoghq.com/env: hotrod
        tags.datadoghq.com/service: hotrod-frontend
        tags.datadoghq.com/version: "1.0.2"
        admission.datadoghq.com/enabled: "true"
      annotations:
        ad.datadoghq.com/frontend.logs: '[{"source": "go", "service": "hotrod-frontend"}]'
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: frontend
          image: docker.io/library/hotrod-dd:1.0.2
          imagePullPolicy: Never
          command: ["/usr/local/bin/hotrod"]
          args:
            - frontend
            - --otel-exporter=datadog
            - --customer-service-hostname=customer
            - --driver-service-hostname=driver
            - --route-service-hostname=route
          env:
            - name: DD_SERVICE
              value: hotrod-frontend
            - name: DD_SERVICE_PREFIX
              value: hotrod-
            - name: DD_RUNTIME_METRICS_ENABLED
              value: "true"
            - name: DD_TRACE_SAMPLE_RATE
              value: "1"
            - name: DD_RUM_APPLICATION_ID
              value: 58ed9bf0-b54e-4749-976e-0c4d6d7d242d
            - name: DD_RUM_SERVICE
              value: hotrod-web
            - name: DD_RUM_CLIENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hotrod-rum
                  key: client-token
                  optional: true
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: hotrod
spec:
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
